name: Test Azure AI Setup

on:
  workflow_dispatch:  # Manual trigger only

permissions:
  contents: read

jobs:
  test-azure-setup:
    name: Validate Azure AI Configuration
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required secrets
        id: check_secrets
        run: |
          echo "🔍 Checking Azure AI configuration..."
          echo ""
          
          MISSING_SECRETS=()
          
          # Check each required secret
          if [ -z "${{ secrets.AZURE_OPENAI_ENDPOINT }}" ]; then
            MISSING_SECRETS+=("AZURE_OPENAI_ENDPOINT")
          fi
          
          if [ -z "${{ secrets.AZURE_OPENAI_API_KEY }}" ]; then
            MISSING_SECRETS+=("AZURE_OPENAI_API_KEY")
          fi
          
          if [ -z "${{ secrets.AZURE_OPENAI_DEPLOYMENT }}" ]; then
            MISSING_SECRETS+=("AZURE_OPENAI_DEPLOYMENT")
          fi
          
          # API version is optional (has default)
          if [ -z "${{ secrets.AZURE_API_VERSION }}" ]; then
            echo "ℹ️  AZURE_API_VERSION not set, will use default: 2024-02-15-preview"
          fi
          
          if [ ${#MISSING_SECRETS[@]} -gt 0 ]; then
            echo "❌ Missing required secrets:"
            for secret in "${MISSING_SECRETS[@]}"; do
              echo "   - $secret"
            done
            echo ""
            echo "Please add these secrets in:"
            echo "Settings → Secrets and variables → Actions → New repository secret"
            echo ""
            echo "See .github/AZURE_AI_SETUP.md for detailed setup instructions"
            exit 1
          fi
          
          echo "✅ All required secrets are configured"

      - name: Validate endpoint format
        run: |
          ENDPOINT="${{ secrets.AZURE_OPENAI_ENDPOINT }}"
          
          echo "🔍 Validating endpoint format..."
          
          # Check if endpoint starts with https://
          if [[ ! "$ENDPOINT" =~ ^https:// ]]; then
            echo "❌ Endpoint must start with https://"
            echo "   Current value starts with: ${ENDPOINT:0:10}..."
            exit 1
          fi
          
          # Check if endpoint ends with trailing slash (should not)
          if [[ "$ENDPOINT" =~ /$ ]]; then
            echo "⚠️  Warning: Endpoint should not end with a trailing slash"
            echo "   This may cause issues. Please remove it."
          fi
          
          # Mask most of the endpoint for security
          MASKED_ENDPOINT="${ENDPOINT:0:20}...${ENDPOINT: -10}"
          echo "✅ Endpoint format valid: $MASKED_ENDPOINT"

      - name: Display configuration
        run: |
          echo "📋 Azure AI Configuration:"
          echo ""
          echo "Endpoint:    ${ENDPOINT:0:25}...${ENDPOINT: -15}"
          echo "API Key:     ${API_KEY:0:8}...${API_KEY: -4}"
          echo "Deployment:  $DEPLOYMENT"
          echo "API Version: $API_VERSION"
          echo ""
        env:
          ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          API_VERSION: ${{ secrets.AZURE_API_VERSION || '2024-02-15-preview' }}

      - name: Test Azure OpenAI API connection
        id: test_api
        run: |
          echo "🧪 Testing Azure OpenAI API connection..."
          
          ENDPOINT="${{ secrets.AZURE_OPENAI_ENDPOINT }}"
          API_KEY="${{ secrets.AZURE_OPENAI_API_KEY }}"
          DEPLOYMENT="${{ secrets.AZURE_OPENAI_DEPLOYMENT }}"
          API_VERSION="${{ secrets.AZURE_API_VERSION || '2024-02-15-preview' }}"
          
          # Construct the full URL
          URL="${ENDPOINT}/openai/deployments/${DEPLOYMENT}/chat/completions?api-version=${API_VERSION}"
          
          # Prepare request body
          REQUEST_BODY='{
            "messages": [
              {
                "role": "system",
                "content": "You are a helpful assistant."
              },
              {
                "role": "user",
                "content": "Say hello in one word."
              }
            ],
            "max_tokens": 10,
            "temperature": 0.3
          }'
          
          echo ""
          echo "🔍 DEBUG: Request Details"
          echo "----------------------------------------"
          echo "Full URL: ${URL}"
          echo ""
          echo "Request Body:"
          echo "$REQUEST_BODY"
          echo ""
          echo "Headers:"
          echo "  Content-Type: application/json"
          echo "  api-key: ${API_KEY:0:8}...${API_KEY: -4}"
          echo "----------------------------------------"
          echo ""
          
          echo "Making test request to Azure OpenAI..."
          
          # Make test API call
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "api-key: $API_KEY" \
            -d "$REQUEST_BODY")
          
          # Extract HTTP status code (last line)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          # Extract response body (all but last line)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo ""
          echo "Response Status: $HTTP_CODE"
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Test API call successful!"
            echo ""
            
            # Try to extract model name and response
            MODEL=$(echo "$BODY" | grep -o '"model":"[^"]*"' | head -1 | cut -d'"' -f4)
            CONTENT=$(echo "$BODY" | grep -o '"content":"[^"]*"' | head -1 | cut -d'"' -f4)
            
            if [ -n "$MODEL" ]; then
              echo "   Model: $MODEL"
            fi
            if [ -n "$CONTENT" ]; then
              echo "   Response: $CONTENT"
            fi
            
            echo ""
            echo "🎉 Azure AI is configured correctly!"
            echo "   The similarity analysis workflow is ready to use."
            
          elif [ "$HTTP_CODE" -eq 401 ]; then
            echo "❌ Authentication failed (401 Unauthorized)"
            echo ""
            echo "Possible causes:"
            echo "  - Invalid API key"
            echo "  - API key has been revoked"
            echo "  - Wrong endpoint or deployment name"
            echo ""
            echo "Troubleshooting:"
            echo "  1. Verify API key in Azure Portal (Keys and Endpoint)"
            echo "  2. Try regenerating the API key"
            echo "  3. Update AZURE_OPENAI_API_KEY secret with new key"
            echo ""
            echo "Response: $BODY"
            exit 1
            
          elif [ "$HTTP_CODE" -eq 404 ]; then
            echo "❌ Resource not found (404)"
            echo ""
            echo "Possible causes:"
            echo "  - Wrong deployment name: $DEPLOYMENT"
            echo "  - Wrong endpoint: ${ENDPOINT:0:30}..."
            echo "  - Deployment not fully created yet"
            echo ""
            echo "Troubleshooting:"
            echo "  1. Check deployment name in Azure Portal (Model deployments)"
            echo "  2. Verify deployment status is 'Succeeded'"
            echo "  3. Ensure endpoint matches Azure Portal (Keys and Endpoint)"
            echo "  4. Wait a few minutes if deployment was just created"
            echo ""
            echo "Response: $BODY"
            exit 1
            
          elif [ "$HTTP_CODE" -eq 429 ]; then
            echo "⚠️  Rate limit exceeded (429)"
            echo ""
            echo "You've hit the rate limit for your Azure OpenAI deployment."
            echo ""
            echo "Solutions:"
            echo "  1. Wait a few minutes and try again"
            echo "  2. Increase quota in Azure Portal"
            echo "  3. Use a different deployment"
            echo ""
            echo "Response: $BODY"
            exit 1
            
          else
            echo "❌ API request failed with status code: $HTTP_CODE"
            echo ""
            echo "Response body:"
            echo "$BODY"
            echo ""
            echo "Troubleshooting hints:"
            echo "  - Check Azure OpenAI service health"
            echo "  - Review Azure Portal for service issues"
            echo "  - Verify all secrets are correct"
            echo "  - See .github/AZURE_AI_SETUP.md for more help"
            exit 1
          fi

      - name: Success summary
        if: success()
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════╗"
          echo "║                                                        ║"
          echo "║  ✅  Azure AI Setup Test Passed Successfully!         ║"
          echo "║                                                        ║"
          echo "╚════════════════════════════════════════════════════════╝"
          echo ""
          echo "Your Azure AI configuration is working correctly."
          echo ""
          echo "Next steps:"
          echo "  1. Create a test PR with prompt or code changes"
          echo "  2. The similarity analysis workflow will run automatically"
          echo "  3. Check the PR comments for the analysis report"
          echo ""
          echo "Documentation:"
          echo "  - Setup guide: .github/AZURE_AI_SETUP.md"
          echo "  - Configuration: .github/similarity-config.yml"
          echo ""
