name: AI-generated LOC report

on:
  workflow_dispatch: {}   # run manually
  push:
    branches: [ main ]    # or your default branch

permissions:
  contents: read

jobs:
  ai-loc-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # IMPORTANT: need full history for git log

      - name: Get total LOC from source files
        id: codeql_loc
        run: |
          # Count total lines in source files (excluding dependencies)
          TOTAL_LOC=$(find . -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.py' -o -name '*.css' -o -name '*.html' \) \
            -not -path '*/node_modules/*' \
            -not -path '*/__pycache__/*' \
            -not -path '*/.git/*' \
            | xargs wc -l 2>/dev/null | tail -n1 | awk '{print $1}')
          echo "Total LOC (CodeQL baseline): $TOTAL_LOC"
          echo "TOTAL_LOC=$TOTAL_LOC" >> "$GITHUB_OUTPUT"

      - name: Compute AI-generated LOC from git trailers
        id: ai_loc
        run: |
          # Get all commits that have trailer 'AI-Generated: true' or 'Co-authored-by: Copilot'
          git log --all --grep='AI-Generated: true' --grep='Co-authored-by: Copilot' --format='%H' > ai_commits.txt

          if [ ! -s ai_commits.txt ]; then
            echo "No AI-Generated commits found"
            echo "AI_LOC=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AI_LOC=0

          while read SHA; do
            # Sum the "added lines" column from numstat for this commit
            ADDED=$(git show --numstat --format='' "$SHA" \
              | awk '{ added += $1 } END { print added+0 }')
            AI_LOC=$((AI_LOC + ADDED))
          done < ai_commits.txt

          echo "AI-generated LOC (added by such commits): $AI_LOC"
          echo "AI_LOC=$AI_LOC" >> "$GITHUB_OUTPUT"

      - name: Print summary
        run: |
          TOTAL=${{ steps.codeql_loc.outputs.TOTAL_LOC }}
          AI=${{ steps.ai_loc.outputs.AI_LOC }}

          if [ -z "$TOTAL" ] || [ "$TOTAL" = "0" ]; then
            echo "Total LOC is zero or unknown; cannot compute percentage."
            exit 0
          fi

          PCT=$(awk "BEGIN {printf \"%.2f\", ($AI/$TOTAL)*100}")

          echo ""
          echo "Total lines of code (CodeQL baseline): $TOTAL"
          echo "Lines added by AI-Generated commits:  $AI"
          echo "Percentage AI-generated:              $PCT%"
          echo ""
